<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Valeaxia Connect</title>
<style>
  body{font-family:system-ui,sans-serif;background:#0f1115;color:#e8e8e8;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0;padding:16px}
  .box{max-width:560px;width:100%;background:#1a1d24;border-radius:12px;padding:24px}
  code{display:block;word-break:break-all;background:#000;padding:12px;border-radius:8px;margin:12px 0;font-size:14px}
  button{background:#fe2c55;color:#fff;border:0;padding:10px 18px;border-radius:8px;font-size:15px;cursor:pointer}
  .err{color:#ff6b6b}
</style>
</head>
<body>
<div class="box">
  <h2>Valeaxia × TikTok</h2>
  <div id="out">Reading authorization…</div>
</div>
<script>
  const p = new URLSearchParams(location.search);
  const out = document.getElementById('out');
  const code = p.get('code');
  const err = p.get('error');
  const state = p.get('state') || '';
  if ((code || err) && state.startsWith('local-')) {
    out.textContent = 'Returning to Valeaxia Uploader…';
    location.replace('http://127.0.0.1:5005/callback' + location.search);
  } else if (code) {
    out.innerHTML = '<p>Authorization code (paste it into the script):</p><code id="c"></code><button id="b">Copy</button>';
    document.getElementById('c').textContent = code;
    document.getElementById('b').onclick = () => navigator.clipboard.writeText(code).then(() => b.textContent = 'Copied');
  } else if (err) {
    out.innerHTML = '<p class="err"></p>';
    out.firstChild.textContent = 'Error: ' + err + ' ' + (p.get('error_description') || '');
  } else {
    out.textContent = 'No authorization code in this URL.';
  }
</script>
</body>
</html>
